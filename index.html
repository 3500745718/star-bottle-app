    // 计算关系能量：积极情绪(开心/平静)加分，消极(难过/生气/焦虑/疲惫)减分
    function energyScore() {
      if (!letters.length) return 50;
      var score = 50;
      letters.forEach(function(l) {
        var emo = emotionByLabel(l.emotionLabel) || emotionByLevel(l.emotionLevel);
        if (!emo) return;
        switch (emo.level) {
          case 1: score += 3; break;  // 开心
          case 4: score += 1.5; break; // 平静
          case 2: score -= 2; break;  // 难过
          case 3: score -= 2.5; break; // 生气
          case 5: score -= 1.5; break; // 焦虑
          case 6: score -= 1; break;  // 疲惫
        }
      });
      // 愿望完成加分
      score += couple.wishes.filter(function(w){ return w.done; }).length * 1.5;
      // 共同回忆加分
      score += couple.events.length * 0.5;
      score = Math.max(5, Math.min(100, Math.round(score)));
      return score;
    }
    function energyLevel(score) {
      if (score >= 80) return { label: '热恋满满 💖', hint: '你们的感情浓烈炽热，多记录这些美好时刻吧！' };
      if (score >= 60) return { label: '甜蜜升温 💕', hint: '感情稳定甜蜜，继续保持这份温度。' };
      if (score >= 40) return { label: '平淡相守 🤍', hint: '感情趋于平稳，偶尔制造一点小惊喜吧。' };
      if (score >= 20) return { label: '需要浇灌 🌱', hint: '最近负面情绪有点多，多和对方聊聊、一起做点开心的事。' };
      return { label: '需要呵护 💔', hint: '感情有些疲惫了，好好沟通，互相理解最重要。' };
    }
    function renderCpEnergy() {
      var body = document.getElementById('cpEnergyBody');
      var score = energyScore();
      var lv = energyLevel(score);
      // 情绪分类统计
      var pos = 0, neg = 0;
      letters.forEach(function(l) {
        var emo = emotionByLabel(l.emotionLabel) || emotionByLevel(l.emotionLevel);
        if (!emo) return;
        if (emo.level === 1 || emo.level === 4) pos++;
        else if (emo.level === 2 || emo.level === 3 || emo.level === 5 || emo.level === 6) neg++;
      });
      var total = pos + neg;
      var html = '';
      html += '<div class="energy-card">' +
        '<div class="ec-label">当前关系能量</div>' +
        '<div class="ec-value">' + score + '<span> / 100</span></div>' +
        '<div class="energy-bar"><div class="eb-fill" style="width:' + score + '%"></div></div>' +
        '<div class="ec-hint">' + escapeHTML(lv.label) + '</div>' +
      '</div>';
      html += '<div class="energy-break">' +
        '<span class="tag">😊 积极 <b>' + pos + '</b></span>' +
        '<span class="tag">🌧 消极 <b>' + neg + '</b></span>' +
        '<span class="tag">🎯 愿望 <b>' + couple.wishes.filter(function(w){return w.done;}).length + '</b></span>' +
      '</div>';
      html += '<div class="cp-sub">💬 能量解读</div>' +
        '<div style="font-size:13px;color:rgba(245,230,211,0.75);line-height:1.8;">' + escapeHTML(lv.hint) + '</div>';
      html += '<div class="cp-sub">📈 情绪构成</div>';
      if (total > 0) {
        var posPct = Math.round(pos / total * 100);
        var negPct = 100 - posPct;
        html += '<div class="energy-bar" style="height:16px;"><div class="eb-fill" style="width:' + posPct + '%;background:linear-gradient(90deg,#f4d03f,#e74c3c);"></div></div>' +
          '<div class="energy-break">' +
            '<span class="tag" style="color:#ffd57a;">积极占 <b>' + posPct + '%</b></span>' +
            '<span class="tag" style="color:#7aa8d9;">消极占 <b>' + negPct + '%</b></span>' +
          '</div>';
      } else {
        html += '<div class="cp-empty">写几封信后，这里会展示你们的情绪构成。</div>';
      }
      body.innerHTML = html;
    }

    // —— 愿望清单 ——
    function openCpWish() {
      closeMoreModal();
      renderCpWish();
      document.getElementById('cpWishModal').classList.add('active');
    }
    function renderCpWish() {
      var body = document.getElementById('cpWishBody');
      var doneCount = couple.wishes.filter(function(w){ return w.done; }).length;
      var pct = couple.wishes.length ? Math.round(doneCount / couple.wishes.length * 100) : 0;
      var html = '';
      if (couple.wishes.length) {
        html += '<div class="wish-progress">' +
          '<div class="wp-bar"><div class="wp-fill" style="width:' + pct + '%"></div></div>' +
          '<div class="wp-text">' + doneCount + '/' + couple.wishes.length + ' 已实现（' + pct + '%）</div>' +
        '</div>';
      }
      html += '<div class="wish-list">';
      if (!couple.wishes.length) {
        html += '<div class="cp-empty">还没有愿望，写下你们想一起完成的事吧 🌟</div>';
      } else {
        couple.wishes.forEach(function(w) {
          html += '<div class="wish-item' + (w.done ? ' done' : '') + '">' +
            '<button class="wish-check" onclick="toggleWish(' + w.id + ')">✓</button>' +
            '<div class="wi-text">' + escapeHTML(w.text) + '</div>' +
            '<button class="wi-del" onclick="delWish(' + w.id + ')">✕</button>' +
          '</div>';
        });
      }
      html += '</div>';
      html += '<div class="wish-add-row">' +
        '<input id="wishText" placeholder="想一起完成的愿望…" onkeydown="if(event.key===\'Enter\')addWish()">' +
        '<button class="cp-btn primary" onclick="addWish()">许愿</button>' +
      '</div>';
      body.innerHTML = html;
    }
    function addWish() {
      var text = (document.getElementById('wishText').value || '').trim();
      if (!text) { showToast('请输入愿望内容'); return; }
      couple.wishes.push({ id: Date.now(), text: text, done: false, date: Date.now() });
      saveCouple();
      renderCpWish();
      showToast('已许下愿望 🌟');
    }
    function toggleWish(id) {
      var w = couple.wishes.find(function(x){ return x.id === id; });
      if (w) { w.done = !w.done; saveCouple(); renderCpWish(); }
    }
    function delWish(id) {
      couple.wishes = couple.wishes.filter(function(x){ return x.id !== id; });
      saveCouple();
      renderCpWish();
    }

    // —— 共同回忆（专属事件记录）——
    function openCpEvent() {
      closeMoreModal();
      renderCpEvent();
      document.getElementById('cpEventModal').classList.add('active');
    }
    function renderCpEvent() {
      var body = document.getElementById('cpEventBody');
      var html = '';
      html += '<div class="cp-sub">记录你们一起走过的特别时刻</div>';
      if (!couple.events.length) {
        html += '<div class="cp-empty">还没有回忆，记下第一次约会、一起旅行… 的瞬间吧 📖</div>';
      } else {
        html += '<div class="evt-list">';
        couple.events.slice().sort(function(a,b){ return b.timestamp - a.timestamp; }).forEach(function(ev) {
          var d = new Date(ev.timestamp);
          html += '<div class="evt-item">' +
            '<div class="ei-head">' +
              '<div class="ei-title">' + escapeHTML(ev.title) + '</div>' +
              '<button class="ei-del" onclick="delEvent(' + ev.id + ')">✕</button>' +
            '</div>' +
            '<div class="ei-date">' + (d.getFullYear()) + '年' + (d.getMonth()+1) + '月' + d.getDate() + '日' + '</div>' +
            (ev.note ? '<div class="ei-note">' + escapeHTML(ev.note) + '</div>' : '') +
          '</div>';
        });
        html += '</div>';
      }
      html += '<div class="evt-add-row">' +
        '<input class="ei-title-in" id="evtTitle" placeholder="回忆标题，如：第一次旅行">' +
        '<button class="cp-btn primary" onclick="addEvent()">记录</button>' +
      '</div>' +
      '<div class="evt-add-row">' +
        '<textarea class="ei-note-in" id="evtNote" placeholder="写下那天的细节和心情…（可选）"></textarea>' +
      '</div>';
      body.innerHTML = html;
    }
    function addEvent() {
      var title = (document.getElementById('evtTitle').value || '').trim();
      if (!title) { showToast('请填写回忆标题'); return; }
      var note = (document.getElementById('evtNote').value || '').trim();
      couple.events.push({ id: Date.now(), title: title, note: note, timestamp: Date.now() });
      saveCouple();
      renderCpEvent();
      showToast('已记录这段回忆 📖');
    }
    function delEvent(id) {
      couple.events = couple.events.filter(function(x){ return x.id !== id; });
      saveCouple();
      renderCpEvent();
    }

    /* ===== Service Worker Registration (PWA) ===== */
    if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('sw.js').catch(function() {});
      });
    }

    /* ===== Init ===== */
    migrateLetters();
    createBgStars();
    createShootingStars();
    updateDateTime();
    setInterval(updateDateTime, 1000);
    renderEmotionSelector();
    rebuildStars();
    initShakeDetection();
    renderCoupleBadge();
    showGreeting();

    /* 云端同步启动（已配置 GitHub 仓库时启动；未配置则静默跳过） */
    startCloudSync();

    /* 旧数据迁移：补全新字段 + 星星配色改为情绪绑定（保留已有配色） */
    function migrateLetters() {
      var changed = false;
      letters.forEach(function(l) {
        if (l.starred === undefined) { l.starred = false; changed = true; }
        if (l.pinned === undefined) { l.pinned = false; changed = true; }
        if (l.tags === undefined) { l.tags = []; changed = true; }
        if (!l.emotionLabel && l.emotionLevel) {
          var emo = emotionByLevel(l.emotionLevel);
          if (emo) l.emotionLabel = emo.label;
          changed = true;
        }
        if (!l.starColors) {
          // 老数据：给没有配色的生成情绪绑定配色
          l.starColors = generateStarColors(l.id || Math.floor(Math.random() * 1e9), emotionByLabel(l.emotionLabel));
          changed = true;
        }
      });
      if (changed) saveLetters();
    }
  </script>
</body>
</html>
