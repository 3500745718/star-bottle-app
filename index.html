<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#1a1721">
  <title>小耿 ✦ 星星瓶子</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="星星瓶子">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Serif+SC:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    /* ===== Reset & Base ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: "Noto Serif SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", serif;
      -webkit-user-select: none;
      user-select: none;
    }
    textarea, input { -webkit-user-select: text; user-select: text; }

    /* ===== Sky Background ===== */
    .sky {
      position: fixed;
      inset: 0;
      background:
        /* 极淡的暖色地平线微光，贴近纯黑夜空 */
        radial-gradient(ellipse 90% 55% at 50% 105%, rgba(40,70,110,0.14) 0%, transparent 62%),
        radial-gradient(ellipse 55% 40% at 50% 62%, rgba(55,40,95,0.10) 0%, transparent 72%),
        radial-gradient(ellipse 42% 30% at 18% 22%, rgba(40,95,150,0.10) 0%, transparent 68%),
        radial-gradient(ellipse 36% 26% at 85% 34%, rgba(80,55,120,0.09) 0%, transparent 68%),
        linear-gradient(180deg, #020408 0%, #050a12 30%, #0a1420 52%, #070f19 72%, #020408 100%);
      z-index: 0;
    }
    .sky::before {
      /* 极淡的深空星云，几乎隐没于黑暗 */
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 28% 20% at 22% 26%, rgba(140,175,255,0.06), transparent 72%),
        radial-gradient(ellipse 24% 17% at 78% 20%, rgba(190,150,255,0.05), transparent 72%),
        radial-gradient(ellipse 32% 22% at 60% 78%, rgba(110,190,255,0.05), transparent 72%);
      pointer-events: none;
    }
    .sky::after {
      content: '';
      position: absolute;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.05'/%3E%3C/svg%3E");
      pointer-events: none;
    }
    .stars-bg {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
    }
    .bg-star {
      position: absolute;
      border-radius: 50%;
      opacity: 0;
      animation: twinkle var(--dur, 3s) ease-in-out infinite;
      animation-delay: var(--delay, 0s);
    }
    .bg-star.s-white { background: #fff; box-shadow: 0 0 6px rgba(255,255,255,0.95); }
    .bg-star.s-warm { background: #fff4da; box-shadow: 0 0 8px rgba(255,228,170,0.9); }
    .bg-star.s-blue { background: #e2f0ff; box-shadow: 0 0 8px rgba(180,215,255,0.9); }
    .bg-star.big {
      box-shadow: 0 0 16px var(--glow, rgba(255,255,255,0.95));
      /* 大亮星增加十字星芒 */
    }
    .bg-star.big::after {
      content: '';
      position: absolute;
      left: 50%;
      top: 50%;
      width: 300%;
      height: 1px;
      transform: translate(-50%, -50%);
      background: linear-gradient(90deg, transparent, var(--glow, rgba(255,255,255,0.6)), transparent);
      opacity: 0.6;
      border-radius: 1px;
    }
    .bg-star.big::before {
      content: '';
      position: absolute;
      left: 50%;
      top: 50%;
      width: 1px;
      height: 300%;
      transform: translate(-50%, -50%);
      background: linear-gradient(180deg, transparent, var(--glow, rgba(255,255,255,0.6)), transparent);
      opacity: 0.6;
      border-radius: 1px;
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.02; transform: scale(0.6); }
      45% { opacity: var(--max-op, 0.9); transform: scale(1.25); }
      60% { opacity: var(--mid-op, 0.5); transform: scale(1.05); }
    }
    /* ===== 流星特效 ===== */
    .shooting-star {
      position: absolute;
      width: 2px;
      height: 2px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 8px 1px rgba(255,255,255,0.9);
      opacity: 0;
      pointer-events: none;
      z-index: 2;
    }
    /* 拖尾：向左上延伸（流星朝右下划，尾迹留在后方） */
    .shooting-star::before {
      content: '';
      position: absolute;
      right: 0;
      top: -1px;
      width: 130px;
      height: 2px;
      background: linear-gradient(270deg, rgba(255,255,255,0.9), rgba(180,210,255,0.25), transparent);
      border-radius: 2px;
      transform: rotate(20deg);
      transform-origin: right center;
    }
    @keyframes meteor {
      0%   { transform: translate(0, 0); opacity: 0; }
      4%   { opacity: 1; }
      16%  { transform: translate(120px, 60px); opacity: 1; }
      24%  { transform: translate(200px, 100px); opacity: 0; }
      100% { transform: translate(200px, 100px); opacity: 0; }
    }
    /* 行星微调，融入新背景 */
    .planet {
      position: absolute;
      top: 7%;
      right: 9%;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #dce8ff, #9ab6e8 55%, #5a78b8 100%);
      box-shadow: 0 0 34px rgba(170,200,255,0.25), inset -6px -6px 12px rgba(20,30,60,0.3);
      opacity: 0.6;
      z-index: 1;
    }
    .planet::before {
      content: '';
      position: absolute;
      top: 55%;
      left: 20%;
      width: 60%;
      height: 8px;
      border-radius: 50%;
      background: rgba(10,20,40,0.2);
    }

    /* 月亮：柔和的上弦月，与星空自然融合 */
    .moon {
      position: absolute;
      top: 6%;
      right: 27%;
      width: 64px;
      height: 64px;
      z-index: 1;
      pointer-events: none;
    }
    /* 柔和光晕 */
    .moon .halo {
      position: absolute;
      inset: -18px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,246,225,0.20) 0%, rgba(255,240,210,0.08) 45%, transparent 72%);
      filter: blur(3px);
    }
    /* 月面 */
    .moon .disc {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: radial-gradient(circle at 38% 32%, #fffdf4, #f5ecd8 55%, #e3d6bd 100%);
      box-shadow: inset -7px -9px 16px rgba(180,160,130,0.35), 0 0 30px rgba(255,244,220,0.22);
      overflow: hidden;
    }
    /* 暗面：制造上弦月 */
    .moon .shadow {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: radial-gradient(circle at 68% 50%, rgba(4,8,16,0.92) 0%, rgba(4,8,16,0.72) 42%, rgba(4,8,16,0.18) 70%, transparent 100%);
    }
    /* 月面环形山纹理 */
    .moon .crater { position: absolute; border-radius: 50%; background: rgba(190,170,140,0.28); }
    .moon .c1 { width: 12px; height: 12px; left: 26%; top: 30%; }
    .moon .c2 { width: 7px; height: 7px; left: 52%; top: 58%; }
    .moon .c3 { width: 5px; height: 5px; left: 40%; top: 66%; }
    .moon .c4 { width: 9px; height: 9px; left: 62%; top: 34%; }

    /* 适配小屏 */
    @media (max-width: 480px) {
      .moon { width: 48px; height: 48px; top: 4%; right: 22%; }
      .moon .halo { inset: -12px; }
    }

    /* ===== DateTime Display ===== */
    .datetime {
      position: fixed;
      top: max(20px, env(safe-area-inset-top));
      left: max(20px, env(safe-area-inset-left));
      z-index: 5;
      color: rgba(245,230,211,0.7);
      font-size: 13px;
      line-height: 1.6;
      opacity: 0;
      animation: fadeIn 0.8s ease 0.4s forwards;
    }
    .datetime .date-text {
      font-family: "ZCOOL KuaiLe", "Noto Serif SC", sans-serif;
      font-size: 15px;
      color: rgba(245,230,211,0.85);
      letter-spacing: 1px;
    }
    .datetime .time-text {
      font-size: 12px;
      color: rgba(245,230,211,0.5);
      letter-spacing: 2px;
      font-variant-numeric: tabular-nums;
    }
    .datetime .lunar-text {
      font-size: 11px;
      color: rgba(245,230,211,0.5);
      letter-spacing: 1px;
      margin-top: 3px;
    }
    .datetime .lunar-text .lunar-fest { color: #ff9a8a; }
    .datetime .festival-text {
      display: none;
      font-size: 12px;
      color: #ff9a8a;
      letter-spacing: 1px;
      margin-top: 4px;
      font-family: "ZCOOL KuaiLe", "Noto Serif SC", sans-serif;
      text-shadow: 0 0 12px rgba(255,154,138,0.35);
    }
    .datetime .sign-text {
      font-size: 11px;
      color: rgba(245,230,211,0.45);
      letter-spacing: 0.5px;
      margin-top: 5px;
      line-height: 1.5;
    }
    .datetime .sign-text .sign-lead { color: rgba(212,165,116,0.75); }
    .datetime .stats-text {
      font-size: 11px;
      color: rgba(245,230,211,0.4);
      letter-spacing: 0.5px;
      margin-top: 3px;
      line-height: 1.5;
    }
    .datetime .stats-text b { color: #d4a574; font-weight: 600; }
    .datetime .stats-text .stats-sep { margin: 0 5px; opacity: 0.4; }

    /* ===== Main Scene ===== */
    .scene {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      animation: sceneIn 1s ease 0.3s forwards;
    }
    @keyframes sceneIn { to { opacity: 1; } }
    @keyframes fadeIn { to { opacity: 1; } }

    .bottle-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .bottle-container {
      width: min(260px, 62vw);
      cursor: pointer;
      transition: transform 0.2s ease;
      animation: floatBottle 5s ease-in-out infinite;
    }
    .bottle-container:active { transform: scale(0.97); }
    .bottle-container.jiggle { animation: bottleJiggle 0.4s ease, floatBottle 5s ease-in-out 0.4s infinite; }
    @keyframes floatBottle {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-7px); }
    }
    @keyframes bottleJiggle {
      0%, 100% { transform: rotate(0deg) translateY(0); }
      20% { transform: rotate(-2deg) translateY(-3px); }
      60% { transform: rotate(2deg) translateY(-2px); }
      80% { transform: rotate(-1deg) translateY(0); }
    }
    .bottle-svg { width: 100%; height: auto; display: block; }

    .star-count {
      margin-top: 18px;
      color: rgba(245,230,211,0.6);
      font-size: 14px;
      letter-spacing: 1px;
    }
    .star-count span { color: #d4a574; font-weight: 700; font-size: 16px; }
    .sync-status {
      margin-top: 6px;
      font-size: 11px;
      letter-spacing: 1.5px;
      color: rgba(190,210,240,0.45);
      min-height: 14px;
    }

    .hint {
      margin-top: 10px;
      color: rgba(245,230,211,0.35);
      font-size: 13px;
      letter-spacing: 3px;
      animation: hintPulse 3s ease-in-out infinite;
    }
    @keyframes hintPulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.7; }
    }

    /* ===== 瓶子问候语 ===== */
    .greeting {
      max-width: 86vw;
      margin-top: 7vh;
      margin-bottom: 22px;
      padding: 10px 22px;
      border-radius: 26px;
      background: linear-gradient(135deg, rgba(255,255,255,0.10), rgba(255,255,255,0.04));
      border: 1px solid rgba(255,255,255,0.16);
      -webkit-backdrop-filter: blur(8px);
      backdrop-filter: blur(8px);
      color: rgba(255,246,232,0.92);
      font-size: 15px;
      letter-spacing: 1.5px;
      text-align: center;
      line-height: 1.6;
      box-shadow: 0 4px 18px rgba(0,0,0,0.2);
      opacity: 0;
      transform: translateY(-10px);
      animation: greetingIn 0.9s cubic-bezier(0.34,1.4,0.64,1) 0.5s forwards;
      font-family: "ZCOOL KuaiLe", "Noto Serif SC", sans-serif;
    }
    .greeting .g-emo { margin-right: 4px; }
    @keyframes greetingIn {
      to { opacity: 1; transform: translateY(0); }
    }

    /* ===== Star Float & Shake ===== */
    .star-inner {
      transform-box: fill-box;
      transform-origin: center;
      animation: starFloat 4s ease-in-out infinite;
    }
    @keyframes starFloat {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-1.5px) rotate(2deg); }
    }
    .star-inner.star-shake {
      animation: starShake 0.7s ease-in-out;
    }
    @keyframes starShake {
      0%, 100% { transform: translate(0,0) rotate(0deg); }
      15% { transform: translate(-7px,5px) rotate(-18deg); }
      35% { transform: translate(6px,-4px) rotate(14deg); }
      55% { transform: translate(-5px,-6px) rotate(-10deg); }
      75% { transform: translate(7px,4px) rotate(16deg); }
    }

    .bottle-container.big-shake {
      animation: bottleShake 0.7s ease-in-out;
    }
    @keyframes bottleShake {
      0%, 100% { transform: rotate(0deg) translate(0,0); }
      15% { transform: rotate(-5deg) translate(-7px,2px); }
      35% { transform: rotate(5deg) translate(7px,-2px); }
      55% { transform: rotate(-4deg) translate(-6px,1px); }
      75% { transform: rotate(4deg) translate(6px,-1px); }
    }

    /* ===== Shake Button (desktop only) ===== */
    .shake-btn {
      margin-top: 14px;
      padding: 8px 22px;
      border-radius: 20px;
      border: 1px solid rgba(212,165,116,0.4);
      background: rgba(212,165,116,0.12);
      color: rgba(245,230,211,0.75);
      font-size: 13px;
      font-family: inherit;
      letter-spacing: 2px;
      cursor: pointer;
      display: none;
      transition: all 0.2s;
    }
    .shake-btn:hover {
      background: rgba(212,165,116,0.25);
      color: #fff;
    }
    .shake-btn:active { transform: scale(0.95); }
    body.is-desktop .shake-btn { display: inline-block; }

    /* ===== Overlays & Modals ===== */
    .overlay, .modal {
      position: fixed;
      inset: 0;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .overlay.active, .modal.active {
      opacity: 1;
      pointer-events: auto;
    }

    /* Menu Overlay */
    .menu-overlay {
      background: rgba(15,12,22,0.55);
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
    }
    .menu-card {
      display: flex;
      gap: 20px;
      transform: scale(0.85) translateY(20px);
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .menu-overlay.active .menu-card { transform: scale(1) translateY(0); }
    .menu-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding: 24px 28px;
      background: rgba(245,240,232,0.08);
      border: 1.5px solid rgba(245,230,211,0.2);
      border-radius: 20px;
      color: #f5e6d3;
      font-family: "ZCOOL KuaiLe", "Noto Serif SC", sans-serif;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.25s ease;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      min-width: 110px;
    }
    .menu-btn:active, .menu-btn:hover {
      background: rgba(245,240,232,0.15);
      border-color: rgba(212,165,116,0.5);
      transform: translateY(-2px);
    }
    .menu-icon {
      font-size: 28px;
      line-height: 1;
    }
    .menu-btn.write-btn .menu-icon { color: #d4a574; }
    .menu-btn.view-btn .menu-icon { color: #e8c39e; }
    .menu-btn.more-btn .menu-icon { color: #b8a6d9; }

    /* Write Modal */
    .write-modal { background: rgba(15,12,22,0.72); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
    .write-paper {
      width: min(440px, 92vw);
      max-height: 88vh;
      background:
        repeating-linear-gradient(transparent, transparent 30px, rgba(180,160,130,0.1) 31px),
        linear-gradient(135deg, #faf6ef 0%, #f3ede2 100%);
      border-radius: 16px;
      padding: 24px 22px 20px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.35);
      transform: scale(0.92) translateY(15px);
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .write-modal.active .write-paper { transform: scale(1) translateY(0); }

    /* ===== Write Modal 环境特效 ===== */
    .write-fx {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
      background: transparent;
      transition: background 0.8s ease;
    }
    .write-fx.on-happy   { background: radial-gradient(ellipse at 50% 20%, rgba(255,214,120,0.20), transparent 55%), radial-gradient(ellipse at 80% 90%, rgba(255,150,80,0.12), transparent 50%); }
    .write-fx.on-sad     { background: radial-gradient(ellipse at 50% 0%, rgba(70,90,120,0.35), transparent 60%), linear-gradient(180deg, rgba(60,75,100,0.25), rgba(40,50,70,0.18)); }
    .write-fx.on-angry   { background: radial-gradient(ellipse at 50% 100%, rgba(255,80,30,0.18), transparent 60%), radial-gradient(ellipse at 20% 20%, rgba(200,40,20,0.12), transparent 50%); }
    .write-fx.on-calm    { background: radial-gradient(ellipse at 50% 40%, rgba(120,220,200,0.14), transparent 55%), radial-gradient(ellipse at 20% 80%, rgba(100,180,220,0.10), transparent 50%); }
    .write-fx.on-anxious { background: radial-gradient(ellipse at 50% 30%, rgba(150,110,200,0.14), transparent 55%); }
    .write-fx.on-tired   { background: radial-gradient(ellipse at 50% 50%, rgba(120,120,130,0.10), transparent 60%); }

    .write-fx canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    /* 生气时纸片轻微抖动；焦虑时纸片轻微颤动 */
    .write-modal.em-anxious .write-paper { animation: paperAnxious 0.5s ease-in-out infinite; }
    @keyframes paperAnxious {
      0%,100% { transform: scale(1) translateY(0) rotate(0deg); }
      25% { transform: scale(1) translateY(0.5px) rotate(0.15deg); }
      75% { transform: scale(1) translateY(-0.5px) rotate(-0.15deg); }
    }
    .write-modal.em-angry .write-paper { animation: paperAngry 0.5s ease-in-out infinite; }
    @keyframes paperAngry {
      0%,100% { transform: scale(1); }
      50% { transform: scale(0.995); }
    }

    .paper-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 18px;
      padding-bottom: 12px;
      border-bottom: 1.5px solid rgba(180,160,130,0.2);
    }
    .paper-datetime { color: #6b5d4f; }
    .paper-datetime #writeDate {
      font-family: "ZCOOL KuaiLe", sans-serif;
      font-size: 17px;
      letter-spacing: 1px;
      color: #4a3d2f;
    }
    .paper-datetime #writeTime {
      font-size: 12px;
      color: #9a8d7f;
      letter-spacing: 2px;
      margin-top: 2px;
      font-variant-numeric: tabular-nums;
    }
    .close-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: none;
      background: rgba(107,93,79,0.1);
      color: #6b5d4f;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      flex-shrink: 0;
    }
    .close-btn:active { background: rgba(107,93,79,0.2); transform: scale(0.92); }

    .emotion-section { margin-bottom: 16px; }
    .section-label {
      font-size: 13px;
      color: #9a8d7f;
      margin-bottom: 10px;
      letter-spacing: 1px;
    }
    .emotion-selector {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    .emotion-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      padding: 12px 4px 10px;
      border-radius: 14px;
      border: 2px solid rgba(180,160,130,0.15);
      background: rgba(255,255,255,0.4);
      cursor: pointer;
      transition: all 0.25s ease;
    }
    .emotion-btn .emo-star { width: 26px; height: 26px; transition: transform 0.25s; }
    .emotion-btn .emo-label {
      font-size: 12px;
      color: #6b5d4f;

    .cp-ach-item {
      background: rgba(245,230,211,0.05);

    /* ===== 主界面情侣快捷入口栏 ===== */

    .hq-item {

    .hq-icon {

    .hq-label {
      font-size: 11px;
      color: rgba(255,255,255,0.82);
      letter-spacing: 0.5px;
      white-space: nowrap;
    }
    .hq-badge {
      position: absolute;
      top: 5px;
      right: 5px;
      min-width: 18px;

      font-weight: 700;
      display: flex;
      align-items: center;

    .hq-badge.hidden-badge { display: none; }
    .hq-sub {
      font-size: 9.5px;
      color: var(--hq-c, rgba(245,230,211,0.55));
      letter-spacing: 0.3px;
      height: 12px;
      line-height: 12px;
      white-space: nowrap;
    }
    /* 快捷栏主容器（含天数徽章） */
    .home-lower {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 6px;
    }

    /* 在一起天数徽章美化 */
    .couple-badge {

      flex-direction: column;
      align-items: center;
      gap: 4px;
      animation: fadeIn 0.8s ease 0.6s backwards;
    }
    .day-heart {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 20px;
      border-radius: 28px;
      background: linear-gradient(135deg, rgba(231,76,60,0.20), rgba(231,76,60,0.06));
      border: 1.5px solid rgba(231,76,60,0.45);

      background: radial-gradient(ellipse at 30% 0%, rgba(255,255,255,0.15), transparent 60%);

    .day-heart .heart { font-size: 17px; animation: heartbeat 1.4s ease-in-out infinite; }
    .day-heart .day-num { color: #ff9a8a; font-weight: 700; font-size: 20px; font-family: "ZCOOL KuaiLe", sans-serif; margin: 0 2px; }

    /* Import hidden file input */
    .hidden-file { display: none; }



    /* Confirm dialog */
    .confirm-modal { background: rgba(10,8,15,0.6); z-index: 300; }
    .confirm-box {
      width: min(320px, 84vw);
      background: linear-gradient(135deg, #201b2e, #2a2340);
      border: 1px solid rgba(212,165,116,0.25);
      border-radius: 16px;
      padding: 22px 20px 18px;
      text-align: center;
      transform: scale(0.9);
      transition: transform 0.25s cubic-bezier(0.34,1.56,0.64,1);
    }
    .confirm-modal.active .confirm-box { transform: scale(1); }
    .confirm-title { font-size: 16px; color: #f5e6d3; margin-bottom: 10px; font-family: "ZCOOL KuaiLe", sans-serif; }
    .confirm-text { font-size: 13px; color: rgba(245,230,211,0.7); line-height: 1.7; margin-bottom: 18px; }
    .confirm-actions { display: flex; gap: 10px; justify-content: center; }
    .confirm-btn {
      padding: 9px 22px;
      border-radius: 10px;
      border: none;
      font-size: 14px;
      cursor: pointer;
      font-family: "ZCOOL KuaiLe", sans-serif;
      transition: all 0.2s;
    }
    .confirm-btn.ok { background: linear-gradient(135deg, #d4a574, #c08850); color: #fff; }
    .confirm-btn.danger { background: linear-gradient(135deg, #e74c3c, #c0392b); color: #fff; }
    .confirm-btn.cancel { background: rgba(245,230,211,0.12); color: #f5e6d3; }
    .confirm-btn:active { transform: scale(0.95); }

    /* Stats Modal */
    .stats-modal { background: rgba(15,12,22,0.7); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
    .stats-container {
      width: min(560px, 92vw);
      max-height: 88vh;
      background: linear-gradient(135deg, #1e1a28 0%, #251f33 100%);
      border: 1px solid rgba(212,165,116,0.15);
      border-radius: 18px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transform: scale(0.92) translateY(15px);
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .stats-modal.active .stats-container { transform: scale(1) translateY(0); }
    .stats-body { flex: 1; overflow-y: auto; padding: 18px 22px; }
    .stats-section { margin-bottom: 20px; }
    .stats-title { font-size: 14px; color: rgba(245,230,211,0.6); letter-spacing: 1px; margin-bottom: 12px; }
    .stats-summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 18px;
    }
    .stat-num {
      text-align: center;

      border-radius: 12px;
      padding: 14px 8px;
    }
    .stat-num .v { font-size: 24px; color: #d4a574; font-weight: 700; font-family: "ZCOOL KuaiLe", sans-serif; }
    .stat-num .l { font-size: 12px; color: rgba(245,230,211,0.5); margin-top: 4px; }
    .pie-wrap { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; justify-content: center; }
    .pie-canvas { width: 150px; height: 150px; }
    .pie-legend { display: flex; flex-direction: column; gap: 8px; }
    .pie-legend-item { display: flex; align-items: center; gap: 8px; font-size: 13px; color: rgba(245,230,211,0.8); }
    .pie-legend-item .dot { width: 12px; height: 12px; border-radius: 3px; }
    .pie-legend-item .pct { margin-left: auto; color: rgba(245,230,211,0.5); font-variant-numeric: tabular-nums; }

    /* Bar chart for trend */
    .bar-wrap { display: flex; align-items: flex-end; gap: 10px; height: 130px; padding-top: 10px; }
    .bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; }
    .bar-stack { width: 100%; max-width: 30px; display: flex; flex-direction: column; justify-content: flex-end; height: 100px; border-radius: 4px 4px 0 0; overflow: hidden; }
    .bar-seg { width: 100%; }
    .bar-label { font-size: 11px; color: rgba(245,230,211,0.55); margin-top: 5px; white-space: nowrap; }
    .bar-count { font-size: 10px; color: rgba(245,230,211,0.4); margin-bottom: 3px; }

    /* Calendar Modal */
    .cal-modal { background: rgba(15,12,22,0.7); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
    .cal-container {
      width: min(560px, 94vw);
      max-height: 88vh;
      background: linear-gradient(135deg, #1e1a28 0%, #251f33 100%);
      border: 1px solid rgba(212,165,116,0.15);
      border-radius: 18px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transform: scale(0.92) translateY(15px);
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .cal-modal.active .cal-container { transform: scale(1) translateY(0); }
    .cal-body { flex: 1; overflow-y: auto; padding: 16px 20px; }
    .cal-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .cal-nav-title { font-size: 16px; color: #f5e6d3; font-family: "ZCOOL KuaiLe", sans-serif; letter-spacing: 1px; }
    .cal-nav-btn {
      background: rgba(245,230,211,0.08);
      color: #f5e6d3;
      border: 1px solid rgba(245,230,211,0.15);
      border-radius: 8px;
      padding: 4px 12px;
      cursor: pointer;
      font-family: inherit;
      font-size: 14px;
    }
    .cal-nav-btn:hover { background: rgba(245,230,211,0.15); }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
    .cal-dow { text-align: center; font-size: 11px; color: rgba(245,230,211,0.4); padding: 4px 0; }
    .cal-day {
      aspect-ratio: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      font-size: 13px;
      color: rgba(245,230,211,0.7);
      cursor: pointer;
      position: relative;
      transition: all 0.2s;
      background: rgba(245,230,211,0.03);
    }
    .cal-day:hover { background: rgba(245,230,211,0.1); }
    .cal-day.empty { cursor: default; background: transparent; }
    .cal-day.today { border: 1px solid #d4a574; }
    .cal-day.selected { background: rgba(212,165,116,0.25); color: #fff; }
    .cal-dots { display: flex; gap: 2px; margin-top: 2px; }
    .cal-dot { width: 5px; height: 5px; border-radius: 50%; }
    .cal-day-list { margin-top: 14px; }
    .cal-day-title { font-size: 13px; color: rgba(245,230,211,0.6); margin-bottom: 8px; }
    .cal-letter {
      background: linear-gradient(135deg, #faf6ef, #f3ede2);
      border-radius: 10px;
      border-left: 4px solid var(--emo-color);
      padding: 10px 12px;
      margin-bottom: 8px;
    }
    .cal-letter .cl-top { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
    .cal-letter .cl-emo { font-size: 11px; color: #fff; background: var(--emo-color); border-radius: 8px; padding: 1px 8px; }
    .cal-letter .cl-time { font-size: 11px; color: #9a8d7f; }
    .cal-letter .cl-content { font-size: 13px; color: #3d2b1f; line-height: 1.6; white-space: pre-wrap; word-break: break-word; max-height: 90px; overflow-y: auto; }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 70px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: rgba(30,26,40,0.92);
      border: 1px solid rgba(212,165,116,0.3);
      color: #f5e6d3;
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 13px;
      z-index: 500;
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s ease;
      max-width: 80vw;
      text-align: center;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* Fold Animation Overlay */
    .fold-overlay {
      position: fixed;
      inset: 0;
      z-index: 200;
      background: rgba(15,12,22,0.75);
      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .fold-overlay.active { opacity: 1; pointer-events: auto; }
    .fold-scene {
      position: relative;
      width: 200px;
      height: 300px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .paper-fold {
      width: 72px;
      height: 90px;
      background:
        repeating-linear-gradient(transparent, transparent 16px, rgba(180,160,130,0.15) 17px),
        linear-gradient(135deg, #faf6ef, #f0e8d8);
      border-radius: 3px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.25);
      position: absolute;
      opacity: 0;
    }
    .paper-fold.folding { animation: foldPaper 0.8s cubic-bezier(0.55, 0, 0.45, 1) forwards; }
    @keyframes foldPaper {
      0% { transform: scale(1) rotate(0deg); opacity: 1; }
      25% { transform: scale(0.85) rotate(90deg); opacity: 0.95; }
      50% { transform: scale(0.6) rotate(180deg); opacity: 0.8; border-radius: 20%; }
      75% { transform: scale(0.4) rotate(270deg); opacity: 0.5; border-radius: 40%; }
      100% { transform: scale(0.15) rotate(360deg); opacity: 0; border-radius: 50%; }
    }
    .star-fold {
      position: absolute;
      opacity: 0;
      transform: scale(0);
    }
    .star-fold.appearing { animation: starAppear 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
    @keyframes starAppear {
      0% { transform: scale(0) rotate(-180deg); opacity: 0; }
      60% { transform: scale(1.3) rotate(10deg); opacity: 1; }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }
    .star-fold.dropping { animation: starDrop 0.9s cubic-bezier(0.4, 0, 0.6, 1) forwards; }
    @keyframes starDrop {
      0% { transform: translateY(0) scale(1) rotate(0deg); opacity: 1; }
      30% { transform: translateY(50px) scale(0.9) rotate(15deg); opacity: 1; }
      60% { transform: translateY(120px) scale(0.6) rotate(30deg); opacity: 0.7; }
      100% { transform: translateY(220px) scale(0.1) rotate(45deg); opacity: 0; }
    }

    /* Responsive */
    @media (max-width: 480px) {
      .menu-card { flex-direction: column; gap: 14px; }
      .menu-btn { flex-direction: row; min-width: 180px; padding: 16px 24px; }
      .emotion-btn { padding: 10px 2px 8px; }
      .emotion-btn .emo-star { width: 22px; height: 22px; }
      .emotion-btn .emo-label { font-size: 11px; }
      .planet { width: 40px; height: 40px; top: 5%; right: 7%; }
      .more-grid { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
  <!-- Sky Background -->
  <div class="sky"></div>
  <div class="stars-bg" id="starsBg"></div>
  <div class="planet"></div>
  <div class="moon">
    <div class="halo"></div>
    <div class="disc">
      <div class="shadow"></div>
      <div class="crater c1"></div>
      <div class="crater c2"></div>
      <div class="crater c3"></div>
      <div class="crater c4"></div>
    </div>
  </div>

  <!-- DateTime -->
  <div class="datetime">
    <div class="date-text" id="dateText"></div>
    <div class="time-text" id="timeText"></div>
    <div class="lunar-text" id="lunarText"></div>
    <div class="festival-text" id="festivalText"></div>
    <div class="sign-text" id="signText"></div>
    <div class="stats-text" id="statsText"></div>
  </div>

  <!-- Main Scene -->
  <div class="scene" id="scene">
    <div class="greeting" id="greeting"></div>
    <div class="bottle-wrapper">
      <div class="bottle-container" id="bottle">
        <svg viewBox="0 0 240 260" xmlns="http://www.w3.org/2000/svg" class="bottle-svg">
          <defs>
            <!-- 玻璃主体：暖金底光 + 冷蓝环境光 通透渐变 -->
            <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="rgba(180,215,240,0.20)"/>
              <stop offset="25%" stop-color="rgba(170,205,235,0.07)"/>
              <stop offset="50%" stop-color="rgba(255,205,140,0.14)"/>
              <stop offset="78%" stop-color="rgba(180,215,240,0.05)"/>
              <stop offset="100%" stop-color="rgba(255,180,120,0.12)"/>
            </linearGradient>

  <script>
    /* ===== Emotion Data ===== */
    var EMOTIONS = [
      { level: 1, label: '开心', color: '#F4D03F', dark: '#B7950B', light: '#F9E79F' },
      { level: 2, label: '难过', color: '#5DADE2', dark: '#2874A6', light: '#AED6F1' },
      { level: 3, label: '生气', color: '#E74C3C', dark: '#A93226', light: '#EC7063' },
      { level: 4, label: '平静', color: '#58D68D', dark: '#1E8449', light: '#ABEBC6' },
      { level: 5, label: '焦虑', color: '#AF7AC5', dark: '#7D3C98', light: '#D2B4DE' },
      { level: 6, label: '疲惫', color: '#95A5A6', dark: '#5D6D7E', light: '#CCD1D1' },
    ];
    // 情绪色系 -> 星星面片色彩（与情绪绑定）
    function emoToStarColors(emo) {
      if (!emo) emo = EMOTIONS[0];
      return { top: emo.light, light: emo.light, base: emo.color, dark: emo.dark, edge: emo.dark };
    }

    /* ===== Star SVG Generator ===== */
    function createStarSVG(colors, size) {
      size = size || 20;
      if (!colors) colors = generateStarColors();
      var faces = buildStarFaces(colors);
      return '<svg viewBox="0 0 100 100" width="' + size + '" height="' + size + '" xmlns="http://www.w3.org/2000/svg" class="star-svg">'
        + faces
        + '</svg>';
    }

    /* ===== Data Storage ===== */
    var STORAGE_KEY = 'star_bottle_letters_v2';
    var letters = [];
    try { letters = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); } catch(e) { letters = []; }
    // 兼容 v1 旧数据
    if (letters.length === 0) {
      try {
        var old = JSON.parse(localStorage.getItem('star_bottle_letters_v1') || '[]');
        if (old.length) letters = old;
      } catch(e) {}
    }

    /* ===== 情侣数据存储 ===== */
    var COUPLE_KEY = 'star_bottle_couple_v1';
    var couple = { startDate: '', anniversaries: [], events: [], wishes: [] };
    try {
      var _c = JSON.parse(localStorage.getItem(COUPLE_KEY) || '{}');
      if (_c && typeof _c === 'object') {
        couple.startDate = _c.startDate || '';
        couple.anniversaries = _c.anniversaries || [];
        couple.events = _c.events || [];
        couple.wishes = _c.wishes || [];
      }

    function todaySign() {
      var now = new Date();
      var seed = now.getFullYear() * 10000 + (now.getMonth() + 1) * 100 + now.getDate();
      function rand() { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; }
      var pool = SIGN_ITEMS.slice();
      var picks = [];
      for (var i = 0; i < 3 && pool.length; i++) {
        picks.push(pool.splice(Math.floor(rand() * pool.length), 1)[0]);
      }
      return picks;
    }

    // 连续记录天数
    function recordStreak() {
      if (!letters.length) return 0;
      var dayMap = {};
      letters.forEach(function(l) {
        var d = new Date(l.timestamp);
        dayMap[d.getFullYear() + '-' + d.getMonth() + '-' + d.getDate()] = true;
      });
      var cur = new Date(); cur.setHours(0,0,0,0);
      if (!dayMap[cur.getFullYear() + '-' + cur.getMonth() + '-' + cur.getDate()]) {
        cur = new Date(cur.getFullYear(), cur.getMonth(), cur.getDate() - 1);
      }
      var streak = 0;
      while (dayMap[cur.getFullYear() + '-' + cur.getMonth() + '-' + cur.getDate()]) {
        streak++;
        cur = new Date(cur.getFullYear(), cur.getMonth(), cur.getDate() - 1);
      }
      return streak;
    }

    // 从今天起往后找农历月日对应的公历日
    function findNextLunarDate(key) {
      var now = new Date(); now.setHours(0,0,0,0);
      for (var i = 0; i < 420; i++) {
        var d = new Date(now.getFullYear(), now.getMonth(), now.getDate() + i);
        var l = solarToLunar(d.getFullYear(), d.getMonth() + 1, d.getDate());
        if (!l.isLeap && (l.month + '/' + l.day) === key) return d;
      }
      return null;
    }

    // 假日/纪念日倒计时：优先返回30天内的情侣节日或纪念日
    function nextHolidayInfo() {
      var now = new Date(); now.setHours(0,0,0,0);
      var y = now.getFullYear();
      var candidates = [];
      function pushSolar(name, month, day, lover) {
        var d = new Date(y, month - 1, day);
        var days = Math.round((d - now) / 86400000);
        if (days < 0) { d = new Date(y + 1, month - 1, day); days = Math.round((d - now) / 86400000); }
        candidates.push({ name: name, days: days, lover: !!lover });
      }
      pushSolar('元旦', 1, 1, false);
      pushSolar('情人节', 2, 14, true);
      pushSolar('五一', 5, 1, false);
      pushSolar('520', 5, 20, true);
      var qixi = findNextLunarDate('7/7');
      if (qixi) candidates.push({ name: '七夕', days: Math.round((qixi - now) / 86400000), lover: true });
      var zhongqiu = findNextLunarDate('8/15');
      if (zhongqiu) candidates.push({ name: '中秋节', days: Math.round((zhongqiu - now) / 86400000), lover: false });
      var chunjie = findNextLunarDate('1/1');
      if (chunjie) candidates.push({ name: '春节', days: Math.round((chunjie - now) / 86400000), lover: false });
      pushSolar('国庆节', 10, 1, false);
      pushSolar('圣诞节', 12, 25, true);
      // 周末
      var toSat = (6 - now.getDay() + 7) % 7;
      candidates.push({ name: '周末', days: toSat, lover: false });
      // 用户纪念日
      (couple.anniversaries || []).forEach(function(a) {
        var du = daysUntil(a.date);
        if (du !== null && du >= 0) candidates.push({ name: a.title, days: du, lover: true });
      });
      // 排序：天数近的在前，同天数情侣类优先
      candidates.sort(function(a, b) {
        if (a.days !== b.days) return a.days - b.days;
        if (a.lover !== b.lover) return a.lover ? -1 : 1;
        return 0;
      });
      // 30天内有情侣节日/纪念日则优先显示
      var loverCand = null;
      for (var i = 0; i < candidates.length; i++) {
        if (candidates[i].lover) { loverCand = candidates[i]; break; }
      }
      if (loverCand && loverCand.days <= 30) return loverCand;
      return candidates[0] || null;
    }

    /* ===== Random Color Helpers ===== */
    function randomInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }
    function seededRandom(seed) {
      var n = Number(seed);
      if (!isFinite(n)) n = Math.abs((seed || '').toString().split('').reduce(function(a, c) { return (a + c.charCodeAt(0)) % 100000; }, 7));
      var x = Math.sin(n) * 10000;
      return x - Math.floor(x);
    }
    // 与情绪绑定的星星配色：基于情绪基准色的 HSL 微调生成五层面片色
    function generateStarColors(seed, emo) {
      // emo: 情绪对象。若无则全随机色相（兼容）
      var h, s, l;
      if (emo) {
        // 从情绪主色提取色相/饱和度/亮度基准
        var rgb = hexToRgb(emo.color);
        var hsl = rgbToHsl(rgb.r, rgb.g, rgb.b);
        h = hsl.h;
        s = hsl.s * 100;
        l = hsl.l * 100;
        // 微调
        h += (seed !== undefined ? Math.floor(seededRandom(seed) * 24) - 12 : randomInt(-12, 12));
        h = ((h % 360) + 360) % 360;
        s = Math.max(40, Math.min(95, s + (seed !== undefined ? Math.floor(seededRandom(seed+1)*16)-8 : randomInt(-8,8))));
        l = Math.max(38, Math.min(62, l + (seed !== undefined ? Math.floor(seededRandom(seed+2)*14)-7 : randomInt(-7,7))));
      } else if (seed !== undefined) {
        h = Math.floor(seededRandom(seed) * 360);
        s = 72 + Math.floor(seededRandom(seed + 1) * 23);
        l = 45 + Math.floor(seededRandom(seed + 2) * 15);
      } else {
        h = randomInt(0, 359);
        s = randomInt(72, 95);
        l = randomInt(45, 60);
      }
      function hslc(dl, ds) {
        var ll = Math.max(6, Math.min(92, l + dl));
        var ss = Math.max(20, Math.min(100, s + (ds || 0)));
        return 'hsl(' + h + ',' + ss + '%,' + ll + '%)';
      }
      return {
        top:   hslc(18, -6),
        light: hslc(9,  -3),
        base:  hslc(0),
        dark:  hslc(-14, 2),
        edge:  hslc(-26, 6)
      };
    }
    function hexToRgb(hex) {
      var r = 0, g = 0, b = 0;
      hex = (hex || '').replace('#','');
      if (hex.length === 6) {
        r = parseInt(hex.substr(0,2),16);
        g = parseInt(hex.substr(2,2),16);
        b = parseInt(hex.substr(4,2),16);
      }
      return { r: r, g: g, b: b };
    }
    function rgbToHsl(r, g, b) {
      r/=255; g/=255; b/=255;
      var max = Math.max(r,g,b), min = Math.min(r,g,b);
      var h, s, l = (max+min)/2;
      if (max === min) { h = s = 0; }
      else {
        var d = max-min;
        s = l > 0.5 ? d/(2-max-min) : d/(max+min);
        switch(max) {
          case r: h = (g-b)/d + (g<b ? 6 : 0); break;
          case g: h = (b-r)/d + 2; break;
          default: h = (r-g)/d + 4;
        }
        h *= 60;
      }
      return { h: h, s: s, l: l };
    }

    /* ===== 3D Origami Star Facets ===== */
    function buildStarFaces(c) {
      var tips   = ['50,8','89.9,37.1','74.7,83.9','25.3,83.9','10.1,37.1'];
      var notchs = ['61.8,33.8','69.0,56.2','50,70','31.0,56.2','38.2,33.8'];
      var inner  = ['50,30.5','65.96,42.14','59.88,60.86','40.12,60.86','34.04,42.14'];
      var h = '';
      h += '<path d="M 50,8 L 61.8,33.8 L 89.9,37.1 L 69.0,56.2 L 74.7,83.9 L 50,70 L 25.3,83.9 L 31.0,56.2 L 10.1,37.1 L 38.2,33.8 Z" '
         + 'fill="' + c.base + '" stroke="' + c.edge + '" stroke-width="1.6" stroke-linejoin="round"/>';
      for (var i = 0; i < 5; i++) {
        var prev = (i + 4) % 5;
        h += '<polygon points="' + inner[i] + ' ' + tips[i] + ' ' + notchs[prev] + '" fill="' + c.light + '"/>';
        h += '<polygon points="' + tips[i] + ' ' + notchs[i] + ' ' + inner[i] + '" fill="' + c.dark + '"/>';
      }
      h += '<polygon points="' + inner.join(' ') + '" fill="' + c.top + '"/>';
      h += '<polygon points="' + inner.join(' ') + '" fill="none" stroke="rgba(0,0,0,0.22)" stroke-width="1" stroke-linejoin="round"/>';
      h += '<path d="M 50,30.5 L 50,8 M 65.96,42.14 L 89.9,37.1 M 59.88,60.86 L 74.7,83.9 M 40.12,60.86 L 25.3,83.9 M 34.04,42.14 L 10.1,37.1" '
         + 'stroke="rgba(255,255,255,0.28)" stroke-width="1" fill="none"/>';
      h += '<polygon points="50,39.5 56.38,44.16 53.95,51.64 46.05,51.64 43.62,44.16" fill="rgba(255,255,255,0.20)"/>';
      return h;
    }

    /* ===== 2D Physics Engine for Bottle Stars ===== */
    var activeStars = [];
    var pendingStars = [];
    var physRunning = false;
    var physRaf = null;
    var physLast = 0;
    var releaseAccum = 0;

    var BOTTLE = {
      left: 52, right: 188,
      mouthY: 58,
      bottomY: function(x) {
        var t = (x - 120) / 70;
        return 212 - 37 * t * t;
      }
    };
    var PHYS = { gravity: 620, restitution: 0.4, friction: 0.88, drag: 0.992 };

    function starSizeForTotal(total) {
      if (total <= 30) return { min: 17, max: 27 };
      if (total <= 60) return { min: 14, max: 22 };
      if (total <= 100) return { min: 11, max: 17 };
      return { min: 9, max: 13 };
    }

    function makeStarData(idx, entering) {
      var l = letters[idx];
      var seedBase = (l && l.id) || (idx * 7919);
      var sr = function(offset) { return seededRandom(seedBase + offset); };
      var sz = starSizeForTotal(letters.length);
      var baseSize = sz.min + sr(4) * (sz.max - sz.min);
      // 星星颜色与情绪绑定：用该信件情绪生成专属配色（若已有 starColors 且含情绪色则保留）
      var colors = null;
      var emo = l ? emotionByLabel(l.emotionLabel) : null;
      if (l && l.starColors) {
        colors = l.starColors;
      } else {
        colors = generateStarColors(seedBase, emo);
      }
      return {
        x: entering ? (108 + Math.random() * 24) : (108 + sr(1) * 24),
        y: entering ? 12 : 12,
        vx: entering ? (Math.random() - 0.5) * 60 : (sr(7) - 0.5) * 60,
        vy: 0,
        r: baseSize / 2,
        rot: sr(3) * 360,
        rotV: (sr(8) - 0.5) * 150,
        scale: baseSize / 100,
        colors: colors,
        el: null
      };
    }

    function buildStarDom(data, idx) {
      var container = document.getElementById('bottleStars');
      var g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      g.setAttribute('class', 'phys-star');
      var inner = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      inner.setAttribute('class', 'star-inner');
      var d = Math.abs(Math.sin(idx * 2.7));
      var dur = 3.2 + Math.abs(Math.cos(idx * 1.7)) * 2.5;
      inner.setAttribute('style', 'animation-delay:' + (d * -4) + 's;animation-duration:' + dur + 's');
      inner.innerHTML = '<path d="M 50,10 L 61.8,35.8 L 89.9,39.1 L 69.0,58.2 L 74.7,85.9 L 50,72 L 25.3,85.9 L 31.0,58.2 L 10.1,39.1 L 38.2,35.8 Z" '
        + 'fill="rgba(0,0,0,0.22)" transform="translate(1.5,2.5)"/>'
        + buildStarFaces(data.colors);
      g.appendChild(inner);
      container.appendChild(g);
      data.el = g;
    }

    function applyBounds(s, dt, REST, FRIC, G) {
      var r = s.r;
      if (s.y < 66) {
        var xl, xr;
        if (s.y < 38) { xl = 98; xr = 142; }
        else if (s.y < 64) { var k = (s.y - 38) / 26; xl = 98 - 48 * k; xr = 142 + 48 * k; }
        else { xl = 50; xr = 190; }
        if (s.x < xl + r) { s.x = xl + r; if (s.vx < 0) s.vx = -s.vx * REST; }
        if (s.x > xr - r) { s.x = xr - r; if (s.vx > 0) s.vx = -s.vx * REST; }
      }
      if (s.x < BOTTLE.left + r) { s.x = BOTTLE.left + r; if (s.vx < 0) s.vx = -s.vx * REST; }
      if (s.x > BOTTLE.right - r) { s.x = BOTTLE.right - r; if (s.vx > 0) s.vx = -s.vx * REST; }
      var by = BOTTLE.bottomY(s.x);
      if (s.y + r > by) {
        s.y = by - r;
        if (s.vy > 12) { s.vy = -s.vy * REST; s.rotV += (Math.random() - 0.5) * 60; }
        else { s.vy = 0; s.vx *= 0.85; }
        s.vx *= FRIC;
        var slope = -74 * (s.x - 120) / 4900;
        var tang = slope / Math.sqrt(1 + slope * slope);
        s.vx += G * tang * dt * 0.2;
      }
      if (s.y - r < BOTTLE.mouthY) { s.y = BOTTLE.mouthY + r; if (s.vy < 0) s.vy = 0; }
    }

    function physicsStep(dt) {
      releaseAccum += dt * 45;
      var cnt = Math.floor(releaseAccum);
      releaseAccum -= cnt;
      while (cnt-- > 0 && pendingStars.length) {
        var ps = pendingStars.shift();
        activeStars.push(ps);
        buildStarDom(ps, activeStars.length - 1);
      }
      var n = activeStars.length;
      if (!n) return;
      var G = PHYS.gravity, REST = PHYS.restitution, FRIC = PHYS.friction;
      var dragF = Math.pow(PHYS.drag, dt * 60);
      var i, j;
      for (i = 0; i < n; i++) {
        var s = activeStars[i];
        s.vy += G * dt;
        s.vx *= dragF; s.vy *= dragF;
        s.x += s.vx * dt;
        s.y += s.vy * dt;
        s.rot += s.rotV * dt;
        s.rotV *= Math.pow(0.985, dt * 60);
        applyBounds(s, dt, REST, FRIC, G);
      }
      for (var iter = 0; iter < 3; iter++) {
        for (i = 0; i < n; i++) {
          var a = activeStars[i];
          for (j = i + 1; j < n; j++) {
            var b = activeStars[j];
            var dx = b.x - a.x, dy = b.y - a.y;
            var minD = a.r + b.r;
            var d2 = dx * dx + dy * dy;
            if (d2 >= minD * minD || d2 < 0.0001) continue;
            var d = Math.sqrt(d2);
            var nx = dx / d, ny = dy / d;
            var overlap = minD - d;
            var wa = b.r / (a.r + b.r), wb = a.r / (a.r + b.r);
            a.x -= nx * overlap * wa; a.y -= ny * overlap * wa;
            b.x += nx * overlap * wb; b.y += ny * overlap * wb;
            var na = a.vx * nx + a.vy * ny, nb = b.vx * nx + b.vy * ny;
            var relV = na - nb;
            if (relV > 0) {
              if (relV < 20) {
                a.vx -= na * nx; a.vy -= na * ny;
                b.vx -= nb * nx; b.vy -= nb * ny;
              } else {
                var imp = (1 + REST) * relV * 0.5;
                a.vx -= imp * nx; a.vy -= imp * ny;
                b.vx += imp * nx; b.vy += imp * ny;
                a.rotV += (Math.random() - 0.5) * 26;
                b.rotV += (Math.random() - 0.5) * 26;
              }
            }
          }
        }
        for (i = 0; i < n; i++) applyBounds(activeStars[i], dt, REST, FRIC, G);
      }
      for (i = 0; i < n; i++) {
        var st = activeStars[i];
        if (Math.abs(st.vx) < 8) st.vx = 0;
        if (Math.abs(st.vy) < 12) st.vy = 0;
        if (Math.abs(st.rotV) < 0.5) st.rotV = 0;
      }
    }

    function renderPhysStars() {
      var n = activeStars.length;
      for (var i = 0; i < n; i++) {
        var s = activeStars[i];
        s.el.setAttribute('transform', 'translate(' + s.x + ',' + s.y + ') rotate(' + s.rot + ') scale(' + s.scale + ')');
      }
      var c = document.getElementById('starCount');
      var total = letters.length;
      if (c && +c.textContent !== total) c.textContent = total;
    }

    function startPhysics() {
      if (physRunning) return;
      physRunning = true;
      physLast = performance.now();
      function loop(now) {
        var dt = Math.min(0.033, (now - physLast) / 1000);
        physLast = now;
        physicsStep(dt);
        renderPhysStars();
        if (physRunning) physRaf = requestAnimationFrame(loop);
      }
      physRaf = requestAnimationFrame(loop);
    }

    // 重建全部星星（删除/导入/编辑后调用）
    function rebuildStars() {
      document.getElementById('bottleStars').innerHTML = '';
      activeStars = [];
      pendingStars = [];
      releaseAccum = 0;
      for (var i = 0; i < letters.length; i++) {
        pendingStars.push(makeStarData(i, false));
      }
      startPhysics();
    }

    function addNewStar(idx) {
      var s = makeStarData(idx, true);
      activeStars.push(s);
      buildStarDom(s, activeStars.length - 1);
    }

    function shakeStars() {
      activeStars.forEach(function(s) {
        s.vx += (Math.random() - 0.5) * 720;
        s.vy -= 180 + Math.random() * 420;
        s.rotV += (Math.random() - 0.5) * 460;
      });
    }

    /* ===== Emotion helpers ===== */
    function emotionByLabel(label) {
      if (!label) return null;
      for (var i = 0; i < EMOTIONS.length; i++) {
        if (EMOTIONS[i].label === label) return EMOTIONS[i];
      }
      return null;
    }
    function emotionByLevel(level) {
      for (var i = 0; i < EMOTIONS.length; i++) {
        if (EMOTIONS[i].level === Number(level)) return EMOTIONS[i];
      }
      return null;
    }
    function letterColors(l) {
      if (l.starColors) return l.starColors;
      return generateStarColors(l.id || Math.floor(Math.random()*1e9), emotionByLabel(l.emotionLabel));
    }
    // 编辑情绪时刷新星星配色
    function refreshLetterColors(l) {
      l.starColors = generateStarColors(l.id || Date.now(), emotionByLabel(l.emotionLabel));
    }

    /* ===== Emotion Selector ===== */
    var selectedEmotion = null;
    function renderEmotionSelector() {
      var container = document.getElementById('emotionSelector');
      container.innerHTML = '';
      EMOTIONS.forEach(function(emo) {
        var btn = document.createElement('div');
        btn.className = 'emotion-btn';

        btn.dataset.level = emo.level;
        btn.innerHTML = createStarSVG(emoToStarColors(emo), 26) + '<span class="emo-label">' + emo.label + '</span>';
        btn.addEventListener('click', function() {
          document.querySelectorAll('.emotion-btn').forEach(function(b) { b.classList.remove('selected'); });
          btn.classList.add('selected');

    function updateFoldBtn() {

      var btn = document.getElementById('foldBtn');
      btn.disabled = !selectedEmotion || !text;

    /* ===== 写信环境特效引擎 ===== */
    // 每种情绪对应一种应景的环境特效
    // happy 开心: 暖阳 + 飘落花瓣 | sad 难过: 下雨 + 阴云
    // angry 生气: 火星余烬上升 | calm 平静: 柔和光点漂浮
    // anxious 焦虑: 杂乱细粒子 + 纸片颤动 | tired 疲惫: 尘埃缓缓下坠
    var fxEmotion = null;          // 当前特效情绪类型
    var fxRaf = null;              // 动画帧句柄
    var fxParticles = [];          // 粒子数组
    var fxCanvas = null, fxCtx = null;
    var fxW = 0, fxH = 0;
    var fxT = 0;                   // 时间累加

    // 情绪 label -> 特效类型 key
    function fxKeyFor(label) {
      switch (label) {
        case '开心': return 'happy';
        case '难过': return 'sad';
        case '生气': return 'angry';
        case '平静': return 'calm';
        case '焦虑': return 'anxious';
        case '疲惫': return 'tired';
        default: return null;
      }
    }

    // 在写信弹窗上应用某个情绪的特效
    function applyEmotionFx(emo) {
      var modal = document.getElementById('writeModal');
      var fxEl = document.getElementById('writeFx');
      if (!emo) { stopFx(); return; }
      var key = fxKeyFor(emo.label);
      if (!key) { stopFx(); return; }
      // 清掉旧的抖动 class
      modal.classList.remove('em-anxious', 'em-angry');
      if (key === 'anxious') modal.classList.add('em-anxious');
      if (key === 'angry') modal.classList.add('em-angry');
      // 切换背景氛围
      fxEl.className = 'write-fx on-' + key;
      // 启动对应粒子系统
      startFx(key);
    }

    function startFx(key) {
      stopFx(true);
      fxEmotion = key;
      var c = document.getElementById('writeFxCanvas');
      fxCanvas = c;
      fxCtx = c.getContext('2d');
      resizeFx();
      fxParticles = [];
      fxT = 0;
      // 预填充粒子
      var count = fxCount(key);
      for (var i = 0; i < count; i++) fxParticles.push(makeFxParticle(key, true));
      fxRaf = requestAnimationFrame(fxLoop);
    }

    function stopFx(keepClean) {
      if (fxRaf) { cancelAnimationFrame(fxRaf); fxRaf = null; }
      fxEmotion = null;
      fxParticles = [];
      var modal = document.getElementById('writeModal');
      if (modal) modal.classList.remove('em-anxious', 'em-angry');
      if (!keepClean) {
        var fxEl = document.getElementById('writeFx');
        if (fxEl) fxEl.className = 'write-fx';
      }
    }

    function resizeFx() {
      if (!fxCanvas) return;
      var rect = fxCanvas.parentNode.getBoundingClientRect();
      var dpr = window.devicePixelRatio || 1;
      fxW = rect.width; fxH = rect.height;
      fxCanvas.width = fxW * dpr;
      fxCanvas.height = fxH * dpr;
      fxCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function fxCount(key) {
      switch (key) {
        case 'happy': return 55;
        case 'sad': return 90;
        case 'angry': return 45;
        case 'calm': return 40;
        case 'anxious': return 70;
        case 'tired': return 50;
        default: return 0;
      }
    }

    function makeFxParticle(key, randomSeed) {
      var p = { key: key, x: 0, y: 0, vx: 0, vy: 0, size: 0, rot: 0, vr: 0, life: 1, alpha: 1, color: '', type: 0 };
      // 根据类型初始化
      switch (key) {
        case 'happy':
          // 花瓣
          p.type = Math.random() < 0.7 ? 0 : 1; // 0=花瓣 1=光点
          p.size = 3 + Math.random() * 5;
          p.x = Math.random() * fxW;
          p.y = randomSeed ? Math.random() * fxH : -10;
          p.vx = (Math.random() - 0.5) * 0.6;
          p.vy = 0.6 + Math.random() * 1.2;
          p.rot = Math.random() * Math.PI * 2;
          p.vr = (Math.random() - 0.5) * 0.06;
          p.alpha = 0.6 + Math.random() * 0.4;
          var cols = ['#FFB6C1', '#FFD700', '#FFA07A', '#FFE4E1', '#FF8C69'];
          p.color = cols[Math.floor(Math.random() * cols.length)];
          break;
        case 'sad':
          // 雨滴
          p.type = Math.random() < 0.85 ? 0 : 1; // 0=雨滴 1=雨丝
          p.size = 1 + Math.random() * 1.5;
          p.x = Math.random() * fxW;
          p.y = randomSeed ? Math.random() * fxH : -20;
          p.vy = 6 + Math.random() * 5;
          p.vx = -0.5 - Math.random() * 0.8;
          p.alpha = 0.35 + Math.random() * 0.4;
          p.color = '#9FC5E8';
          break;
        case 'angry':
          // 火星余烬
          p.size = 1.5 + Math.random() * 3;
          p.x = Math.random() * fxW;
          p.y = randomSeed ? Math.random() * fxH : fxH + 10;
          p.vy = -(0.5 + Math.random() * 1.2);
          p.vx = (Math.random() - 0.5) * 0.5;
          p.alpha = 0.7 + Math.random() * 0.3;
          p.life = 0.6 + Math.random() * 0.4;
          var fcols = ['#FF4500', '#FF6B35', '#FFD700', '#FF8C00'];
          p.color = fcols[Math.floor(Math.random() * fcols.length)];
          break;
        case 'calm':
          // 柔和光点
          p.size = 2 + Math.random() * 4;
          p.x = Math.random() * fxW;
          p.y = randomSeed ? Math.random() * fxH : Math.random() * fxH;
          p.vx = (Math.random() - 0.5) * 0.25;
          p.vy = -(0.2 + Math.random() * 0.5);
          p.alpha = 0.3 + Math.random() * 0.5;
          var ccols = ['#A8E6CF', '#C8E6FF', '#9FE8E0', '#B8E0F5'];
          p.color = ccols[Math.floor(Math.random() * ccols.length)];
          break;
        case 'anxious':
          // 杂乱细粒子
          p.size = 1 + Math.random() * 2.5;
          p.x = Math.random() * fxW;
          p.y = randomSeed ? Math.random() * fxH : Math.random() * fxH;
          p.vx = (Math.random() - 0.5) * 2.2;
          p.vy = (Math.random() - 0.5) * 2.2;
          p.alpha = 0.4 + Math.random() * 0.5;
          p.life = 0.4 + Math.random() * 0.6;
          var acols = ['#C9A2E8', '#B77CE8', '#D0A8F0', '#A78BDB'];
          p.color = acols[Math.floor(Math.random() * acols.length)];
          break;
        case 'tired':
          // 尘埃缓缓下坠
          p.size = 1 + Math.random() * 2;
          p.x = Math.random() * fxW;
          p.y = randomSeed ? Math.random() * fxH : -8;
          p.vy = 0.25 + Math.random() * 0.5;
          p.vx = (Math.random() - 0.5) * 0.2;
          p.alpha = 0.2 + Math.random() * 0.3;
          var tcols = ['#A9A9A9', '#B8B8C0', '#909090', '#C0C0C8'];
          p.color = tcols[Math.floor(Math.random() * tcols.length)];
          break;
      }
      return p;
    }

    function updateFxParticle(p) {
      p.x += p.vx; p.y += p.vy;
      if (p.vr) { p.rot += p.vr; }
      if (p.key === 'anxious') {
        // 随机扰动
        p.vx += (Math.random() - 0.5) * 0.6;
        p.vy += (Math.random() - 0.5) * 0.6;
        p.vx *= 0.96; p.vy *= 0.96;
        if (p.vx > 2.5) p.vx = 2.5; if (p.vx < -2.5) p.vx = -2.5;
        if (p.vy > 2.5) p.vy = 2.5; if (p.vy < -2.5) p.vy = -2.5;
      }
      if (p.key === 'angry') {
        p.vx += (Math.random() - 0.5) * 0.15;
        p.life -= 0.003;
        p.alpha = Math.max(0, p.life * 0.9);
      }
      // 生命周期/边界回收
      var dead = false;
      switch (p.key) {
        case 'happy': case 'sad': case 'tired':
          dead = p.y > fxH + 20;
          break;
        case 'angry':
          dead = p.y < -20 || p.life <= 0;
          break;
        case 'calm':
          if (p.y < -20) { p.y = fxH + 20; p.x = Math.random() * fxW; }
          if (p.x < -20) p.x = fxW + 20; if (p.x > fxW + 20) p.x = -20;
          break;
        case 'anxious':
          dead = (p.x < -20 || p.x > fxW + 20 || p.y < -20 || p.y > fxH + 20) && Math.random() < 0.1;
          break;
      }
      if (dead) {
        var np = makeFxParticle(p.key, false);
        p.x = np.x; p.y = np.y; p.vx = np.vx; p.vy = np.vy; p.size = np.size;
        p.rot = np.rot; p.vr = np.vr; p.alpha = np.alpha; p.color = np.color;
        p.life = np.life || 1; p.type = np.type || 0;
      }
    }

    function drawFx() {
      if (!fxCtx) return;
      fxCtx.clearRect(0, 0, fxW, fxH);
      for (var i = 0; i < fxParticles.length; i++) {
        var p = fxParticles[i];
        fxCtx.save();
        fxCtx.globalAlpha = p.alpha;
        fxCtx.fillStyle = p.color;
        switch (p.key) {
          case 'happy':
            if (p.type === 0) {
              // 花瓣（椭圆）
              fxCtx.translate(p.x, p.y); fxCtx.rotate(p.rot);
              fxCtx.beginPath();
              fxCtx.ellipse(0, 0, p.size * 0.7, p.size * 0.35, 0, 0, Math.PI * 2);
              fxCtx.fill();
            } else {
              fxCtx.beginPath(); fxCtx.arc(p.x, p.y, p.size * 0.4, 0, Math.PI * 2); fxCtx.fill();
            }
            break;
          case 'sad':
            if (p.type === 0) {
              fxCtx.beginPath(); fxCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2); fxCtx.fill();
            } else {
              // 雨丝
              fxCtx.strokeStyle = p.color; fxCtx.lineWidth = p.size * 0.7;
              fxCtx.beginPath(); fxCtx.moveTo(p.x, p.y); fxCtx.lineTo(p.x + p.vx * 4, p.y + p.vy * 4); fxCtx.stroke();
            }
            break;
          case 'angry':
            // 发光火星
            fxCtx.shadowColor = p.color; fxCtx.shadowBlur = 8;
            fxCtx.beginPath(); fxCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2); fxCtx.fill();
            break;
          case 'calm':
            // 光晕光点
            var g = fxCtx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size * 2.5);
            g.addColorStop(0, p.color); g.addColorStop(1, 'rgba(255,255,255,0)');
            fxCtx.fillStyle = g;
            fxCtx.beginPath(); fxCtx.arc(p.x, p.y, p.size * 2.5, 0, Math.PI * 2); fxCtx.fill();
            break;
          case 'anxious':
            fxCtx.beginPath(); fxCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2); fxCtx.fill();
            break;
          case 'tired':
            fxCtx.beginPath(); fxCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2); fxCtx.fill();
            break;
        }
        fxCtx.restore();
      }
    }

    function fxLoop() {
      if (!fxEmotion) return;
      fxT++;
      var i;
      for (i = 0; i < fxParticles.length; i++) updateFxParticle(fxParticles[i]);
      drawFx();
      // 补充粒子数（稳定数量）
      while (fxParticles.length < fxCount(fxEmotion)) fxParticles.push(makeFxParticle(fxEmotion, false));
      fxRaf = requestAnimationFrame(fxLoop);
    }

    window.addEventListener('resize', function() {
      if (fxEmotion) resizeFx();
    });

    function renderEmoFilterChips() {

    function getFilteredLetters() {
      var kw = (document.getElementById('searchInput').value || '').trim().toLowerCase();
      var result = letters.filter(function(l) {
        // 情绪筛选
        if (currentEmoFilter !== 'all' && l.emotionLabel !== currentEmoFilter) return false;
        // 置顶筛选
        if (currentPinnedFilter && !l.pinned) return false;
        // 收藏筛选
        if (currentStarredFilter && !l.starred) return false;
        // 关键词
        if (kw) {
          var contentHit = (l.content || '').toLowerCase().indexOf(kw) >= 0;
          var tagsHit = (l.tags || []).some(function(t){ return t.toLowerCase().indexOf(kw) >= 0; });
          if (!contentHit && !tagsHit) return false;
        }
        return true;
      });
      // 置顶优先，然后时间倒序
      result = result.slice().sort(function(a,b){
        if (!!a.pinned !== !!b.pinned) return a.pinned ? -1 : 1;
        return b.timestamp - a.timestamp;
      });
      return result;
    }

    function renderLettersList() {
      var container = document.getElementById('lettersList');
      container.innerHTML = '';

      if (list.length === 0) {

        card.className = 'letter-card' + (letter.pinned ? ' pinned-card' : '');
        card.style.setProperty('--emo-color', emoColor);
        card.style.animationDelay = (idx * 0.03) + 's';
        card.dataset.id = letter.id;

        var hasResolution = letter.resolution && letter.resolution.trim();
        var resolutionHTML = '';

          resolutionHTML =

                '<button class="res-btn res-btn-edit" onclick="editResolution(' + letter.id + ', this)">编辑</button>' +
              '</div>' +
            '</div>';
        } else {
          resolutionHTML =
            '<div class="card-resolution">' +
              '<div class="resolution-label">情绪是怎么消解的</div>' +
              '<textarea class="resolution-input" placeholder="告诉我情绪后来是怎么消失的呗..." rows="2"></textarea>' +
              '<div class="resolution-actions">' +
                '<button class="res-btn res-btn-save" onclick="saveResolution(' + letter.id + ', this)">保存</button>' +
                '<button class="res-btn res-btn-cancel" onclick="cancelResolution(this)">取消</button>' +
              '</div>' +
            '</div>';
        }

        var tagsHTML = '';
        if (letter.tags && letter.tags.length) {
          var tagList = letter.tags.map(function(t) {
            return '<span class="card-tag">' + escapeHTML(t) + '<button onclick="removeTag(event,' + letter.id + ')">×</button></span>';
          }).join('');
          tagsHTML = '<div class="card-tags">' + tagList + '</div>';
        }

        var starHtml = createStarSVG(letterColors(letter), 18);

        var actionsHTML =
          '<div class="card-actions">' +
            '<button class="card-act-btn" onclick="startEdit(' + letter.id + ')">✎ 编辑</button>' +
            '<button class="card-act-btn ' + (letter.starred ? 'on' : '') + '" onclick="toggleStarred(' + letter.id + ')">' + (letter.starred ? '★ 已收藏' : '☆ 收藏') + '</button>' +
            '<button class="card-act-btn ' + (letter.pinned ? 'on' : '') + '" onclick="togglePinned(' + letter.id + ')">' + (letter.pinned ? '📌 已置顶' : '📌 置顶') + '</button>' +

    function doAddTag(letterId, val, row) {
      var letter = letters.find(function(l) { return l.id === letterId; });

    /* ===== Export / Import ===== */
    function download(filename, content, mime) {

      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
    }

      var sorted = letters.slice().sort(function(a,b){ return a.timestamp - b.timestamp; });
      sorted.forEach(function(l) {

        lines.push('========================================');

        lines.push('----------------------------------------');

        lines.push('');

    function handleImport(event) {
      var file = event.target.files[0];
      event.target.value = '';
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function(e) {
        var text = e.target.result;
        openConfirm('导入数据？', '将导入文件中的信件。若文件里带星形配色等完整数据会完整恢复；仅 txt 的也会尝试解析。\n\n是否替换当前所有信件？选择"确定"会用导入内容替换，选择"取消"则会合并追加。', '替换全部', false);
        confirmCallback = function() { applyImport(text, true); };
        // 提供"追加"选项：通过另一个确认
      };
      reader.readAsText(file);
    }
    function applyImport(text, replace) {
      try {
        var parsed;
        var importCouple = null;
        var trimmed = text.trim();
        if (trimmed.charAt(0) === '[' || trimmed.charAt(0) === '{') {
          // JSON
          var obj = JSON.parse(trimmed);
          if (Array.isArray(obj)) {
            parsed = obj;
          } else if (obj.letters) {
            parsed = obj.letters;
            if (obj.couple && typeof obj.couple === 'object') importCouple = obj.couple;
          } else {
            parsed = [obj];
          }
        } else {
          // 尝试解析 txt
          parsed = parseTxt(text);
        }
        var valid = parsed.filter(function(l){ return l && l.content; });
        if (!valid.length && !importCouple) { closeConfirm(); showToast('未识别到有效信件'); return; }
        if (replace) {
          letters = valid;
          if (importCouple) {
            couple.startDate = importCouple.startDate || couple.startDate;
            couple.anniversaries = importCouple.anniversaries || [];
            couple.events = importCouple.events || [];
            couple.wishes = importCouple.wishes || [];
          }
        } else {
          // 合并：按 id 去重追加
          var existingIds = {};
          letters.forEach(function(l){ if(l.id!==undefined) existingIds[l.id]=1; });
          valid.forEach(function(l){
            if (!l.id) l.id = Date.now() + Math.floor(Math.random()*1000);
            if (!existingIds[l.id]) { letters.push(l); existingIds[l.id]=1; }
          });
          if (importCouple) {
            if (importCouple.startDate && !couple.startDate) couple.startDate = importCouple.startDate;
            var hasAnni = {};
            couple.anniversaries.forEach(function(a){ hasAnni[a.id || a.title+a.date]=1; });
            (importCouple.anniversaries || []).forEach(function(a){ if(!hasAnni[a.id || a.title+a.date]){ a.id = a.id || Date.now()+Math.random(); couple.anniversaries.push(a); hasAnni[a.id]=1; } });
            couple.events = couple.events.concat(importCouple.events || []);
            var hasWish = {};
            couple.wishes.forEach(function(w){ hasWish[w.text]=1; });
            (importCouple.wishes || []).forEach(function(w){ if(!hasWish[w.text]){ w.id = w.id || Date.now()+Math.random(); couple.wishes.push(w); hasWish[w.text]=1; } });
          }
        }
        saveLetters();
        saveCouple();
        rebuildStars();
        closeConfirm();
        renderLettersList();
        renderCoupleBadge();
        showToast('导入成功，共 ' + valid.length + ' 封信件');
      } catch(err) {
        closeConfirm();
        showToast('导入失败：文件格式无法识别');
      }
    }
    function parseTxt(text) {
      // 简单解析 txt 备份：按 "============" 分块
      var blocks = text.split(/={10,}/);
      var out = [];
      for (var i = 0; i < blocks.length; i++) {
        var b = blocks[i];
        var timeM = b.match(/时间：(.*?)\n/);
        var emoM = b.match(/心情：(.*?)\n/);
        var content = b.split(/----+/)[1];
        if (content) {
          content = content.replace(/【情绪如何消解】[\s\S]*$/,'').trim();
          var letter = { id: Date.now()+i, timestamp: Date.now(), content: content, resolution: '', emotionLabel: '平静' };
          if (timeM && timeM[1]) {
            // 尝试解析 月日 时:分
            var t = parseShortTime(timeM[1]);
            if (t) letter.timestamp = t;
          }
          if (emoM && emoM[1]) {
            var lbl = emoM[1].replace(/\[[^\]]*\]/g,'').trim();
            if (emotionByLabel(lbl)) letter.emotionLabel = lbl;
          }
          out.push(letter);
        }
      }
      return out;
    }
    function parseShortTime(str) {
      var m = str.match(/(\d{1,2})月(\d{1,2})日\s*(\d{1,2}):(\d{1,2})/);
      if (m) {
        var now = new Date();
        return new Date(now.getFullYear(), Number(m[1])-1, Number(m[2]), Number(m[3]), Number(m[4])).getTime();
      }
      return null;
    }

      }

    function drawPie() {
      var canvas = document.getElementById('pieCanvas');
      var legend = document.getElementById('pieLegend');
      if (!canvas || !legend) return;
      var counts = {};
      letters.forEach(function(l){
        var emo = emotionByLabel(l.emotionLabel) || emotionByLevel(l.emotionLevel);
        var key = emo ? emo.label : '其他';
        counts[key] = (counts[key] || 0) + 1;
      });
      var ctx = canvas.getContext('2d');
      var size = 150, cx = size/2, cy = size/2, r = size/2 - 4;
      canvas.width = size; canvas.height = size;
      ctx.clearRect(0,0,size,size);
      var total = letters.length;
      var start = -Math.PI/2;
      var legendHTML = '';
      Object.keys(counts).forEach(function(label){
        var emo = emotionByLabel(label);
        var color = emo ? emo.color : '#8a7a6a';
        var pct = counts[label]/total;
        var end = start + pct*2*Math.PI;
        ctx.beginPath();
        ctx.moveTo(cx,cy);
        ctx.arc(cx,cy,r,start,end);
        ctx.closePath();
        ctx.fillStyle = color;
        ctx.fill();
        ctx.strokeStyle = '#1e1a28';
        ctx.lineWidth = 1.5;
        ctx.stroke();
        start = end;
        legendHTML += '<div class="pie-legend-item"><span class="dot" style="background:'+color+'"></span>' + label + '<span class="pct">' + Math.round(pct*100) + '% (' + counts[label] + ')</span></div>';
      });
      // 中心文字
      ctx.beginPath();
      ctx.arc(cx,cy,r*0.55,0,2*Math.PI);
      ctx.fillStyle = '#1e1a28';
      ctx.fill();
      ctx.fillStyle = '#f5e6d3';
      ctx.font = 'bold 20px "ZCOOL KuaiLe", sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(total, cx, cy);
      ctx.font = '11px "Noto Serif SC", serif';
      ctx.fillText('封', cx, cy+14);
      legend.innerHTML = legendHTML;
    }
    function drawTrend() {
      var wrap = document.getElementById('trendBars');
      if (!wrap) return;
      // 按月分组
      var months = {};
      var emoColors = {};
      EMOTIONS.forEach(function(e){ emoColors[e.label] = e.color; });
      letters.forEach(function(l){
        var d = new Date(l.timestamp);
        var key = d.getFullYear() + '-' + pad2(d.getMonth()+1);
        var emo = (emotionByLabel(l.emotionLabel) || emotionByLevel(l.emotionLevel) || {label:'其他'}).label;
        if (!months[key]) months[key] = {};
        months[key][emo] = (months[key][emo] || 0) + 1;
      });
      var keys = Object.keys(months).sort();
      // 只显示最近 12 个月
      keys = keys.slice(-12);
      if (!keys.length) return;
      wrap.innerHTML = '';
      keys.forEach(function(key){
        var col = document.createElement('div');
        col.className = 'bar-col';
        var stack = document.createElement('div');
        stack.className = 'bar-stack';
        var m = months[key];
        var segCount = Object.keys(m).reduce(function(s,k){ return s+m[k]; }, 0);
        Object.keys(m).forEach(function(emo){
          var seg = document.createElement('div');
          seg.className = 'bar-seg';
          seg.style.height = (m[emo]/segCount*100) + '%';
          seg.style.background = emoColors[emo] || '#8a7a6a';
          seg.title = emo + ' ' + m[emo] + '封';
          stack.appendChild(seg);
        });
        var label = key.split('-')[1] + '月';
        col.appendChild(stack);
        var cnt = document.createElement('div');
        cnt.className = 'bar-count';
        cnt.textContent = segCount;
        col.appendChild(cnt);
        var lb = document.createElement('div');
        lb.className = 'bar-label';
        lb.textContent = label;
        col.appendChild(lb);
        wrap.appendChild(col);
      });
    }

        '<div class="cal-nav-title">' + calYear + '年' + (calMonth+1) + '月</div>' +
        '<button class="cal-nav-btn" onclick="calNext()">›</button>' +
      '</div>';
      html += '<div class="cal-grid">';
      ['日','一','二','三','四','五','六'].forEach(function(d){ html += '<div class="cal-dow">' + d + '</div>'; });
      var first = new Date(calYear, calMonth, 1);
      var startDow = first.getDay();
      var daysInMonth = new Date(calYear, calMonth+1, 0).getDate();
      for (var i = 0; i < startDow; i++) html += '<div class="cal-day empty"></div>';
      var now = new Date();
      for (var day = 1; day <= daysInMonth; day++) {
        var dateKey = calYear + '-' + pad2(calMonth+1) + '-' + pad2(day);
        var isToday = (now.getFullYear()===calYear && now.getMonth()===calMonth && now.getDate()===day);
        var dayLetters = letters.filter(function(l){
          var d = new Date(l.timestamp);
          return d.getFullYear()===calYear && d.getMonth()===calMonth && d.getDate()===day;
        });
        var dots = '';
        if (dayLetters.length) {
          var shown = dayLetters.slice(0,3);
          dots = '<div class="cal-dots">' + shown.map(function(l){
            var emo = emotionByLabel(l.emotionLabel) || emotionByLevel(l.emotionLevel);
            var c = (l.starColors && l.starColors.base) || (emo ? emo.color : '#F4D03F');
            return '<span class="cal-dot" style="background:' + c + '"></span>';
          }).join('') + '</div>';
        }
        html += '<div class="cal-day' + (isToday?' today':'') + (calSelected===dateKey?' selected':'') + '" data-key="' + dateKey + '" onclick="calPick(\'' + dateKey + '\')">' + day + dots + '</div>';
      }
      html += '</div>';
      html += '<div class="cal-day-list" id="calDayList"></div>';
      body.innerHTML = html;
      if (calSelected) {
        renderCalDayList(calSelected);
      }

    function shakeBottle() {
      if (isShaking) return;
      isShaking = true;

      bottle.classList.remove('big-shake');
      void bottle.offsetWidth;

    var lastShakeCheck = 0;
    var lastAcc = { x: 0, y: 0, z: 0 };
    function onDeviceMotion(e) {
      var acc = e.accelerationIncludingGravity;
      if (!acc) return;
      var now = Date.now();
      if (now - lastShakeCheck < 150) return;
      lastShakeCheck = now;
      var dx = Math.abs(acc.x - lastAcc.x);
      var dy = Math.abs(acc.y - lastAcc.y);
      var dz = Math.abs(acc.z - lastAcc.z);
      lastAcc.x = acc.x; lastAcc.y = acc.y; lastAcc.z = acc.z;
      if (dx + dy + dz > 30) shakeBottle();
    }

    function initShakeDetection() {
      var isMobile = /Android|iPhone|iPad|iPod|Mobile|webOS|BlackBerry/i.test(navigator.userAgent);
      if (isMobile) {
        document.body.classList.remove('is-desktop');
        var hint = document.getElementById('hint');
        if (hint) hint.textContent = '轻触瓶身 · 摇晃手机，程可可会让星星晃起来';
      } else {
        document.body.classList.add('is-desktop');
      }
      if (window.DeviceMotionEvent) {
        var req = DeviceMotionEvent.requestPermission;
        if (typeof req === 'function') {
          var bottle = document.getElementById('bottle');
          function askOnce() {
            req.call(DeviceMotionEvent).then(function(state) {
              if (state === 'granted') window.addEventListener('devicemotion', onDeviceMotion);
            }).catch(function() {});
            bottle.removeEventListener('click', askOnce);
          }
          bottle.addEventListener('click', askOnce);
        } else {
          window.addEventListener('devicemotion', onDeviceMotion);
        }
      }
      var shakeBtn = document.getElementById('shakeBtn');
      if (shakeBtn) shakeBtn.addEventListener('click', shakeBottle);
    }
